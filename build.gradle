plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'co.onmind'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo1.maven.org/maven2' }
}

dependencies {
    // Spring Boot WebFlux
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // R2DBC H2 Database
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'io.r2dbc:r2dbc-h2'

    // MapStruct for object mapping
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // AWS S3 SDK v2 for reactive S3 operations
    implementation platform('software.amazon.awssdk:bom:2.25.27')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:sns'
    implementation 'software.amazon.awssdk:eventbridge'
    implementation 'software.amazon.awssdk:lambda'
    implementation 'software.amazon.awssdk:netty-nio-client'

    // GraalVM Polyglot SDK for sandboxed JavaScript execution
    implementation 'org.graalvm.polyglot:polyglot:24.1.1'
    implementation 'org.graalvm.polyglot:js:24.1.1'

    // Kafka (optional — activate with profile 'kafka')
    implementation 'org.springframework.kafka:spring-kafka'
    
    // RabbitMQ (optional — activate with profile 'rabbitmq')
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // gRPC client for XDB (optional — activate with profile 'grpc')
    implementation 'io.grpc:grpc-netty-shaded:1.69.1'
    implementation 'io.grpc:grpc-protobuf:1.69.1'
    implementation 'io.grpc:grpc-stub:1.69.1'
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    // xdb JAR provides gRPC proto-generated classes (AbcServiceGrpc, AbcRequest, AbcResponse)
    implementation files('../api/xdb/build/libs/onmind-xdb-1.0.0-early2026.jar')

    // Redis (reactive) for caching layer
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Spring Mail — reactive email via JavaMail wrapped in Mono
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Spring for GraphQL (BFF endpoint exposing /abc as GraphQL)
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    
    // Resilience4j — Circuit Breaker and Retry for reactive adapters
    implementation 'io.github.resilience4j:resilience4j-reactor:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'

    // Lombok (optional, for reducing boilerplate)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing dependencies (reactive)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Ensure proper compilation order
compileJava.dependsOn processResources

// JaCoCo — code coverage focused on infrastructure adapters
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(
            classDirectories.files.collect { file ->
                fileTree(dir: file, include: [
                    'co/onmind/hex4w/infrastructure/**/*Adapter.class',
                    'co/onmind/hex4w/infrastructure/scripts/ScriptServicesFacade.class',
                    'co/onmind/hex4w/infrastructure/configuration/WebClientConfiguration.class'
                ])
            }
        ))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            // Aggregate line coverage over the infrastructure adapters only.
            // BUNDLE aggregates all included adapter classes into one ratio,
            // matching the same class set measured in jacocoTestReport.
            element = 'BUNDLE'
            includes = ['co.onmind.hex4w.infrastructure.**']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
        }
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}