plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

// Boot 4.1.1 manages Jackson 3.1.5, which carries CVE-2026-110879.
// Overridden to 3.1.8, the LTS patch line within the same minor.
ext['jackson-bom.version'] = '3.1.8'

group = 'co.onmind'
version = '0.17.0-SNAPSHOT'

java {
    sourceCompatibility = '25'
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo1.maven.org/maven2' }
}

def xdbJar = file('../../../api/xdb/build/libs/onmind-xdb-1.0.0-early2026.jar')

dependencies {
    // Spring Boot WebFlux
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    // R2DBC H2 Database
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'io.r2dbc:r2dbc-h2'

    // MapStruct for object mapping
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // AWS S3 SDK v2 for reactive S3 operations
    implementation platform('software.amazon.awssdk:bom:2.25.27')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:sns'
    implementation 'software.amazon.awssdk:eventbridge'
    implementation 'software.amazon.awssdk:lambda'
    implementation 'software.amazon.awssdk:netty-nio-client'

    // GraalVM Polyglot SDK for sandboxed JavaScript execution.
    // 25.x is required: the 24.x line reads HotSpot internals that changed in JDK 25
    // (jdk.vm.ci.services.Services.IS_BUILDING_NATIVE_IMAGE) and GraalJS fails to start.
    implementation 'org.graalvm.polyglot:polyglot:25.0.5'
    implementation 'org.graalvm.polyglot:js:25.0.5'

    // Kafka (optional — activate with profile 'kafka')
    implementation 'org.springframework.kafka:spring-kafka'
    
    // RabbitMQ (optional — activate with profile 'rabbitmq')
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // gRPC client for XDB (optional — activate with profile 'grpc')
    implementation 'io.grpc:grpc-netty-shaded:1.69.1'
    implementation 'io.grpc:grpc-protobuf:1.69.1'
    implementation 'io.grpc:grpc-stub:1.69.1'
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    if (xdbJar.exists()) {
        // xdb JAR provides gRPC proto-generated classes (AbcServiceGrpc, AbcRequest, AbcResponse)
        implementation files(xdbJar)
    }

    // Redis (reactive) for caching layer
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Spring Mail — reactive email via JavaMail wrapped in Mono
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Spring for GraphQL (BFF endpoint exposing /abc as GraphQL)
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    
    // Resilience4j — Circuit Breaker, Bulkhead and Rate Limiter for the reactive adapters.
    // The bulkhead and the rate limiter bound how much traffic reaches a downstream:
    // without them the only limit is the Reactor Netty connection pool, which queues
    // the excess instead of rejecting it.
    implementation 'io.github.resilience4j:resilience4j-reactor:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-bulkhead:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.2.0'

    // Lombok (optional, for reducing boilerplate)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing dependencies (reactive)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-data-r2dbc-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
}

sourceSets {
    main {
        java {
            if (!xdbJar.exists()) {
                // gRPC proto classes unavailable — skip the gRPC sources so the default
                // build stays green. Enable by providing the xdb JAR.
                exclude 'co/onmind/hex4w/infrastructure/webclients/GrpcAbcAdapter.java'
                exclude 'co/onmind/hex4w/infrastructure/configuration/GrpcConfiguration.java'
            }
        }
    }
    test {
        java {
            if (!xdbJar.exists()) {
                exclude 'co/onmind/hex4w/infrastructure/webclients/GrpcAbcAdapterTest.java'
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Ensure proper compilation order
compileJava.dependsOn processResources

// JaCoCo — code coverage focused on infrastructure adapters
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(
            classDirectories.files.collect { file ->
                fileTree(dir: file, include: [
                    'co/onmind/hex4w/infrastructure/**/*Adapter.class',
                    'co/onmind/hex4w/infrastructure/scripts/ScriptServicesFacade.class',
                    'co/onmind/hex4w/infrastructure/configuration/WebClientConfiguration.class'
                ])
            }
        ))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            // Aggregate line coverage over the infrastructure adapters only.
            // BUNDLE aggregates all included adapter classes into one ratio,
            // matching the same class set measured in jacocoTestReport.
            element = 'BUNDLE'
            includes = ['co.onmind.hex4w.infrastructure.**']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
        }
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}