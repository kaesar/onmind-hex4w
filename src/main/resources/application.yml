spring:
  application:
    name: hex4j-webflux-template
  
  profiles:
    active: dev
  
  # R2DBC H2 Database configuration
  r2dbc:
    url: r2dbc:h2:mem:///hex4w;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
  
  # SQL initialization
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # Kafka disabled by default. Enable with: --spring.profiles.active=dev,kafka
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
    
  # Redis (Lettuce) — used by the XDB cache adapter
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms

  # Mail (SMTP) — used by SmtpEmailAdapter; Mailpit on port 1025 for tests
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
    
  # H2 Console configuration (for development)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
          web-allow-others: false

server:
  port: 8080

# Application-specific configuration
app:
  webclient:
    connect-timeout: 5000
    read-timeout: 10000
    write-timeout: 10000
    max-memory-size: 1048576
    # Reactor Netty pool. The defaults queue the excess for up to 45s instead of
    # rejecting it, so a burst turns into latency instead of a fast failure.
    max-connections: 100
    pending-acquire-max-count: 100
    pending-acquire-timeout: 2000
  # Limits per downstream: calls in flight and calls allowed per period.
  # Optional, the defaults in ResilienceProperties are already sensible.
  resilience:
    abc:
      max-concurrent-calls: 20
      rate-limit-per-period: 50
    s3:
      max-concurrent-calls: 10
      rate-limit-per-period: 20
    lambda:
      max-concurrent-calls: 10
      rate-limit-per-period: 20
  notification:
    email:
      from: hex4w@localhost
      host: localhost
      port: 1025
      endpoint-enabled: false
  graphql:
    enabled: false
    base-url: http://localhost:8081
  s3:
    region: us-east-1
    endpoint: http://localhost:4566
    force-path-style: true
  lambda:
    region: us-east-1
    endpoint: http://localhost:4566  # LocalStack
  sqs:
    # Gap between the end of a batch and the start of the next poll.
    # SQS long polling already waits up to 20s for a message.
    poll-interval-ms: 1000
    # How long SQS hides a received message. Must exceed the longest a script can
    # take, otherwise the message reappears while still being processed.
    visibility-timeout-seconds: 120
  rabbitmq:
    host: localhost
    port: 5672
    exchange:
      default: hex4w.script.commands
      results: hex4w.script.results
    queue:
      script-commands: hex4w.script.commands
  scripts:
    # Directory with .js files (must also be listed in the whitelist below)
    location: classpath:scripts/
    # Comma-separated whitelist of executable script filenames
    whitelist: hello.js,example.js,services.js
    # Statements a script may execute before GraalVM cancels it.
    # Not a wall-clock bound. Set to 0 to disable.
    statement-limit: 5000000
  xdb:
    # XDB ABC API base URL
    base-url: http://localhost:9990
    # gRPC endpoint (activate with profile 'grpc' — uses gRPC instead of HTTP)
    grpc:
      host: localhost
      port: 9991
    auth-type: basic
    # Token value for bearer/basic (leave empty for none)
    auth-token: admin:admin 
    # Redis cache for ABC sheet responses
    cache:
      enabled: true
      ttl-seconds: 300

# Management endpoints
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging configuration
logging:
  level:
    root: INFO
    co.onmind.hex4w: DEBUG
    org.springframework.r2dbc: DEBUG
    io.r2dbc.h2: DEBUG
    org.springframework.web.reactive: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
      
logging:
  level:
    co.onmind.hex4w: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
      
  r2dbc:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    
logging:
  level:
    root: WARN
    co.onmind.hex4w: INFO

---
spring:
  config:
    activate:
      on-profile: prod
      
logging:
  level:
    root: WARN
    co.onmind.hex4w: INFO